name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  draw:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for keymap changes
        id: check
        run: |
          # Always run on manual dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # For push/PR, check if keymap files changed
          if git diff --name-only HEAD~1 HEAD | grep -qE '^config/.*\.(keymap|dtsi)$|^draw/config\.yaml$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache west modules
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            modules/
            .west/
            zephyr/
          key: west-modules-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            west-modules-

      - name: Install west
        if: steps.check.outputs.changed == 'true'
        run: pip install west

      - name: West init and update
        if: steps.check.outputs.changed == 'true'
        run: |
          west init -l config
          west update

      - name: Save west modules cache
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            modules/
            .west/
            zephyr/
          key: west-modules-${{ hashFiles('config/west.yml') }}

      - name: Set up Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install keymap-drawer
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install keymap-drawer
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate keymap visualization
        if: steps.check.outputs.changed == 'true'
        run: |
          # Debug: Find where ZMK files actually are
          echo "=== Checking ZMK module structure ==="
          find modules/zmk -maxdepth 3 -type d | sort
          echo "=== Looking for dts and include directories ==="
          find modules/zmk -name "dts" -o -name "include" | head -20
          echo "=== Looking for behaviors ==="
          find modules -name "behaviors" -type d | head -10
          exit 1  # Exit to see structure before attempting parse
          keymap -c draw/config.yaml parse -z config/corne_choc_pro.keymap > draw/keymap.yaml
          # Show combos only on base layer
          sed -i 's/l: \[MagicSturdy, NAV, NUM\]/l: [MagicSturdy]/g' draw/keymap.yaml
          # Restore original config
          git checkout draw/config.yaml
          # Fix layout reference
          sed -i 's/layout: {zmk_keyboard: corne_choc_pro, layout_name: default_layout}/layout:\n  qmk_info_json: config\/corne_choc_pro.json\n  layout_name: default_layout/' draw/keymap.yaml
          # Generate SVG and PNG
          keymap -c draw/config.yaml draw draw/keymap.yaml > draw/keymap.svg
          rsvg-convert draw/keymap.svg -o draw/keymap.png -w 1400

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw/keymap.svg draw/keymap.yaml draw/keymap.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update keymap visualization [skip ci]"
            git push
          fi
