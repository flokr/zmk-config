name: Draw Keymap
on:
  push:
    branches:
      - main
    paths:
      - 'config/**/*.keymap'
      - 'config/**/*.dtsi'
      - 'draw/config.yaml'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install keymap-drawer
        run: |
          pip install keymap-drawer

      - name: Generate keymap visualization
        run: |
          keymap -c draw/config.yaml parse -z config/corne_choc_pro.keymap > draw/keymap.yaml
          keymap -c draw/config.yaml draw draw/keymap.yaml > draw/keymap.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw/keymap.svg draw/keymap.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update keymap visualization [skip ci]"
            git push
          fi
