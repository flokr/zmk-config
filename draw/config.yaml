parse_config:
  zmk_additional_includes:
    - "config/zmk-helpers/key-labels"

  zmk_preamble: |
    #include <corne_choc_pro.h>
    #define CONFIG_WIRELESS

  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&caps_word": Caps Word

    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4
    "&bt BT_CLR": BT Clear

    "&kp LC(C)": Copy
    "&kp LC(X)": Cut
    "&kp LC(V)": Paste

    "&mag": ⭐
    "&studio_unlock": Studio 🔓

  trans_legend: { "t": "", "type": "trans" }

  zmk_keycode_map:
    # modifiers
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift

    # editing
    BSPC: Bspc
    DEL: Del
    ESC: Esc
    RET: Enter
    SPACE: Spc
    TAB: Tab

    # navigation
    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →
    LEFT_ARROW: ←
    RIGHT_ARROW: →
    UP_ARROW: ↑
    DOWN_ARROW: ↓

    # media
    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_NEXT: $$mdi:skip-forward$$
    C_PREV: $$mdi:skip-backward$$

    # symbols
    AMPERSAND: "&"
    AMPS: "&"
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: "*"
    ASTRK: "*"
    AT: "@"
    AT_SIGN: "@"
    BACKSLASH: \
    BSLH: \
    CARET: ^
    COLON: ":"
    COMMA: ","
    DLLR: $
    DOLLAR: $
    DOT: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: "="
    EXCL: "!"
    EXCLAMATION: "!"
    FSLH: /
    GRAVE: "`"
    GREATER_THAN: ">"
    GT: ">"
    HASH: "#"
    LBKT: "["
    LBRC: "{"
    LEFT_BRACE: "{"
    LEFT_BRACKET: "["
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: "-"
    NON_US_BACKSLASH: \
    NON_US_BSLH: "|"
    NON_US_HASH: "#"
    NUHS: "#"
    PERCENT: "%"
    PERIOD: .
    PIPE: "|"
    PIPE2: "|"
    PLUS: +
    POUND: "#"
    PRCNT: "%"
    QMARK: "?"
    QUESTION: "?"
    RBKT: "]"
    RBRC: "}"
    RIGHT_BRACE: "}"
    RIGHT_BRACKET: "]"
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ;
    SEMICOLON: ;
    SINGLE_QUOTE: "'"
    SLASH: /
    SQT: "'"
    STAR: "*"
    TILDE: "~"
    TILDE2: "~"
    UNDER: _
    UNDERSCORE: _

draw_config:
  append_colon_to_layer_header: false
  dark_mode: false  # Light mode with Solarized theme
  footer_text: "flokr/zmk-config"
  use_local_cache: true  # Avoid SSL issues with QMK API
  
  # Styling
  key_h: 60
  key_w: 60
  split_gap: 40
  
  # Custom CSS with GitHub Light color scheme
  svg_extra_style: |
    /* GitHub Light colors */
    svg.keymap {
      font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
      font-size: 14px;
      fill: #24292e !important;  /* dark gray text */
      background: #ffffff;  /* pure white background */
    }
    
    /* Light key background */
    rect.key {
      fill: #f6f8fa !important;  /* ghost white */
    }
    
    rect.key, rect.combo {
      stroke: #d1d5da !important;  /* light gray border */
      stroke-width: 1;
    }
    
    /* Combo styling - blue accent */
    rect.combo, rect.combo-separate {
      fill: #0366d6 !important;  /* GitHub blue */
    }
    
    /* Layer activator styling - red accent */
    rect.held, rect.combo.held {
      fill: #d73a49 !important;  /* GitHub red */
    }
    
    /* Ghost keys more subtle */
    rect.ghost, rect.combo.ghost {
      opacity: 0.25 !important;
    }
