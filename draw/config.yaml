parse_config:
  zmk_additional_includes:
    - "modules/zmk/helpers/include"
    - "modules/zmk/auto-layer/dts"

  zmk_preamble: |
    #include <corne_choc_pro.h>
    #define CONFIG_WIRELESS

  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&caps_word": Caps Word

    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4
    "&bt BT_SEL 4": BT 5
    "&bt BT_CLR": BT Clear
    "&rgb_ug RGB_TOG": "$$mdi:lightbulb$$"

    "&kp LC(C)": Copy
    "&kp LC(X)": Cut
    "&kp LC(V)": Paste
    
    "&kp LG(C)": Copy
    "&kp LG(X)": Cut
    "&kp LG(V)": Paste
    "&kp LG(Y)": Undo
    "&kp LG(LS(Y))": Redo

    # WM Layer - Aerospace window manager (Ctrl+Alt+Cmd prefix)
    # Uses inline keycodes: &kp LC(LA(LG(X)))
    # Shift held on base layer automatically adds Shift to the combo
    
    # Left Hand - Monitor Management & Resize
    "&kp LC(LA(LG(M)))": "$$mdi:arrow-collapse$$"  # Resize shrink
    "&kp LC(LA(LG(LS(M))))": "$$mdi:arrow-collapse$$"  # Resize shrink (shift same)
    "&kp LC(LA(LG(L)))": ""  # Unbound
    "&kp LC(LA(LG(LS(L))))": ""  # Unbound
    "&kp LC(LA(LG(C)))": "$$mdi:arrow-expand$$"  # Resize grow
    "&kp LC(LA(LG(LS(C))))": "$$mdi:arrow-expand$$"  # Resize grow (shift same)
    "&kp LC(LA(LG(P)))": ""  # Unbound
    "&kp LC(LA(LG(LS(P))))": ""  # Unbound
    "&kp LC(LA(LG(T)))": "$$mdi:monitor$$"  # Focus monitor Built-in
    "&kp LC(LA(LG(LS(T))))": "⇒$$mdi:monitor$$"  # Move WS to Built-in
    "&kp LC(LA(LG(R)))": "⇄"  # Workspace back-and-forth
    "&kp LC(LA(LG(D)))": "$$mdi:monitor$$"  # Focus monitor HP(2)
    "&kp LC(LA(LG(LS(D))))": "⇒$$mdi:monitor$$"  # Move WS to HP(2)
    
    # Right Hand - App Hotkeys
    "&kp LC(LA(LG(Q)))": "$$mdi:email$$"  # Outlook
    "&kp LC(LA(LG(LS(Q))))": "$$mdi:email$$"  # Outlook (shift - no action)
    "&kp LC(LA(LG(Y)))": "$$mdi:web$$"  # Safari
    "&kp LC(LA(LG(LS(Y))))": "+$$mdi:web$$"  # New Safari window
    "&kp LC(LA(LG(O)))": "$$mdi:text-search$$"  # Window switcher
    "&kp LC(LA(LG(LS(O))))": "⇒$$mdi:text-search$$"  # Workspace-move switcher
    "&kp LC(LA(LG(U)))": "$$mdi:chat$$"  # Teams Chat
    "&kp LC(LA(LG(LS(U))))": "$$mdi:chat$$"  # Teams Chat (shift - no action)
    "&kp LC(LA(LG(J)))": "$$mdi:phone$$"  # Teams Call
    "&kp LC(LA(LG(LS(J))))": "$$mdi:phone$$"  # Teams Call (shift - no action)
    
    # Right Hand - Window & Workspace Navigation
    "&kp LC(LA(LG(F)))": "✕"  # Close window
    "&kp LC(LA(LG(N)))": "$$mdi:plus-box$$"  # Focus next empty WS
    "&kp LC(LA(LG(LS(N))))": "⇒$$mdi:plus-box$$"  # Move to next empty WS
    "&kp LC(LA(LG(E)))": "$$mdi:skip-next$$"  # Next workspace
    "&kp LC(LA(LG(LS(E))))": "⇒$$mdi:skip-next$$"  # Move to next workspace
    "&kp LC(LA(LG(I)))": "→"  # Focus right
    "&kp LC(LA(LG(LS(I))))": "⇒→"  # Move right
    "&kp LC(LA(LG(A)))": "⚖"  # Balance sizes
    
    # Right Hand - Bottom Row Apps
    "&kp LC(LA(LG(B)))": "$$mdi:music$$"  # Music
    "&kp LC(LA(LG(LS(B))))": "$$mdi:music$$"  # Music (shift - no action)
    "&kp LC(LA(LG(H)))": ""  # Unbound
    "&kp LC(LA(LG(LS(H))))": ""  # Unbound
    "&kp LC(LA(LG(COMMA)))": "$$mdi:console$$"  # WezTerm
    "&kp LC(LA(LG(SEMI)))": "+$$mdi:console$$"  # New WezTerm (shift sends SEMI on German)
    "&kp LC(LA(LG(DOT)))": ""  # Unbound
    "&kp LC(LA(LG(LS(SEMI))))": ""  # Unbound (dot shift)
    "&kp LC(LA(LG(MINUS)))": ""  # Unbound
    "&kp LC(LA(LG(LS(MINUS))))": ""  # Unbound
    
    # Utility
    "&kp LC(LA(LG(RET)))": "$$mdi:fullscreen$$"  # Fullscreen
    "&kp LC(RET)": "$$mdi:console-line$$"  # tmux prefix (Ctrl+Enter)
    
    # Smart behaviors for WM layer
    "&smart_wm WM 0": {t: "⇄", h: "WM"}  # Tap=ws-back-forth, Hold=WM layer
    "&aero_wbf": "⇄"  # Workspace back-and-forth macro
    "&aero_float": "$$mdi:window-open$$"  # Float toggle macro

    # Pipe symbol
    "&kp RA(GRAVE)": "|"

    # German umlauts and eszett
    "&eszett": ß
    "&de_ae": ä
    "&de_oe": ö
    "&de_ue": ü
    "&de_ae_cap": Ä
    "&de_oe_cap": Ö
    "&de_ue_cap": Ü
    
    # German umlaut mod-morphs
    "&ae_umlaut": {t: ä, s: Ä}
    "&oe_umlaut": {t: ö, s: Ö}
    "&ue_umlaut": {t: ü, s: Ü}
    
    # Combo mod-morphs with correct symbols for German layout
    "&circ_deg": {t: "^", s: "°"}
    "&tick_acu": {t: "`", s: "´"}
    "&lpar_lt": {t: "(", s: "<"}
    "&rpar_gt": {t: ")", s: ">"}
    "&lbkt_lbrc": {t: "[", s: "{"}
    "&rbkt_rbrc": {t: "]", s: "}"}
    "&dqt_sqt": {t: '"', s: "'"}
    "&doll_perc": {t: "$", s: "%"}
    "&comma_semi": {t: ",", s: ";"}
    "&dot_colon": {t: ".", s: ":"}
    
    # Navigation hold-taps - hide the '0' parameter
    "&mt_home 0 0": {t: "←", h: "⌥←"}
    "&mt_end 0 0": {t: "→", h: "⌥→"}
    "&mt_doc_start 0 0": {t: "↑", h: "Cmd+↑"}
    "&mt_doc_end 0 0": {t: "↓", h: "Cmd+↓"}
    
    # Word deletion macros
    "&mac_word_bspc": "⌥⌫"
    "&mac_word_del": "⌥⌦"
    
    # Home/End navigation macros
    "&mac_home": Home
    "&mac_end": End

    # Screenshot macro
    "&mac_screenshot": 📷4

    # SMART_NUM - label the tap-dance behavior
    "&num_dance": {t: "Numword", s: "Sticky NUM"}
    "&smart_num 1 0": {t: "Numword", h: "NUM", s: "Sticky NUM"}



    # SYMBOL layer - hold-tap: tap Enter, hold SYMBOL
    "&lt_ent 4 RET": {t: "Enter", h: "SYMBOL"}
    # FUN layer - simple momentary access
    "&mo FUN": FUN

    # MAGIC_SHIFT - tap for sticky shift, double-tap for caps-word, hold for shift
    "&magic_shift LSHFT 0": {t: "⭐ Shift", h: "Shift"}
    "&magic_shift RSHFT 0": {t: "⭐ Shift", h: "Shift"}

    "&mag": ⭐
    "&key_repeat": ⟳
    "&studio_unlock": Studio 🔓

  trans_legend: { "t": "", "type": "trans" }

  zmk_combos:
    combo_cut: { align: bottom, o: 0.15 }

  zmk_keycode_map:
    # modifiers
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift

    # editing
    BSPC: Bspc
    DEL: Del
    ESC: Esc
    RET: Enter
    SPACE: Spc
    TAB: Tab

    # navigation
    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →
    LEFT_ARROW: ←
    RIGHT_ARROW: →
    UP_ARROW: ↑
    DOWN_ARROW: ↓

    # media
    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_NEXT: $$mdi:skip-forward$$
    C_PREV: $$mdi:skip-backward$$

    # symbols
    AMPERSAND: "&"
    AMPS: "&"
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: "*"
    ASTRK: "*"
    AT: "@"
    AT_SIGN: "@"
    BACKSLASH: \
    BSLH: \
    CARET: ^
    COLON: ":"
    COMMA: ","
    DLLR: $
    DOLLAR: $
    DOT: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: "="
    EXCL: "!"
    EXCLAMATION: "!"
    FSLH: "-"          # German: FSLH key = minus/dash
    GRAVE: <           # German: GRAVE key = less than
    GREATER_THAN: ">"
    GT: ">"
    HASH: "#"
    LBKT: ü            # German: LBKT key = u-umlaut
    LBRC: "{"
    LEFT_BRACE: "{"
    LEFT_BRACKET: "["
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: ß           # German: MINUS key = eszett
    NON_US_BACKSLASH: \
    NON_US_BSLH: "|"
    NON_US_HASH: "#"   # Austrian: # key position
    NUHS: "#"
    PERCENT: "%"
    PERIOD: .
    PIPE: "|"
    PIPE2: "|"
    PLUS: +
    POUND: "#"
    PRCNT: "%"
    QMARK: "?"
    QUESTION: "?"
    RBKT: +            # German: + key = plus
    RBRC: "}"
    RIGHT_BRACE: "}"
    RIGHT_BRACKET: "]"
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ö            # German: SEMI key = o-umlaut
    SEMICOLON: ;
    SINGLE_QUOTE: "'"
    SLASH: /
    SQT: ä             # German: SQT key = a-umlaut
    STAR: "*"
    TILDE: "~"
    TILDE2: "~"
    UNDER: _
    UNDERSCORE: _
    
    # German QWERTZ layout - Shift+Number combinations
    "LS(MINUS)": "?"   # Shift+ß = question mark
    "LS(N1)": "!"      # Shift+1 = exclamation
    "LS(N2)": '"'      # Shift+2 = double quote
    "LS(N4)": $        # Shift+4 = dollar
    "LS(N5)": "%"      # Shift+5 = percent
    "LS(N6)": "&"      # Shift+6 = ampersand
    "LS(N7)": /        # Shift+7 = forward slash
    "LS(N8)": (        # Shift+8 = left paren
    "LS(N9)": )        # Shift+9 = right paren
    "LS(N0)": "="      # Shift+0 = equals
    
    # German QWERTZ layout - AltGr combinations
    "RA(Q)": "@"       # AltGr+Q = at sign
    "RA(N7)": "{"      # AltGr+7 = left brace
    "RA(N8)": "["      # AltGr+8 = left bracket
    "RA(N9)": "]"      # AltGr+9 = right bracket
    "RA(N0)": "}"      # AltGr+0 = right brace
    "RA(MINUS)": \     # AltGr+ß = backslash
    "RA(RBKT)": "~"    # AltGr++ = tilde
    "RA(NUBS)": "|"    # AltGr+< = pipe
    "LS(RA(N7))": \    # Shift+AltGr+7 = backslash (macOS)
    
    # German QWERTZ layout - Special keys
    "NUBS": <          # NUBS key = less than
    "LS(NUBS)": ">"    # Shift+NUBS = greater than
    "LS(NON_US_HASH)": "'"  # Shift+# = single quote
    "LS(RBKT)": "*"    # Shift++ = asterisk
    "LS(FSLH)": _      # Shift+/ = underscore
    "LS(EQUAL)": "`"   # Shift+dead = backtick
    "LS(GRAVE)": ">"   # Shift+GRAVE = greater than (for German layout)
    "LS(SQT)": Ä       # Shift+SQT = capital a-umlaut
    "LS(SEMI)": Ö      # Shift+SEMI = capital o-umlaut
    "LS(LBKT)": Ü      # Shift+LBKT = capital u-umlaut
    "RA(GRAVE)": "|"   # AltGr+GRAVE = pipe (for German layout)

draw_config:
  append_colon_to_layer_header: false
  dark_mode: false  # Light mode with Solarized theme
  footer_text: "flokr/zmk-config"
  use_local_cache: true  # Avoid SSL issues with QMK API
  
  # Layer order - Combos is virtual layer created via --virtual-layers flag
  layer_order: ["MagicSturdy", "Combos", "NAV", "NUM", "WM", "FUN", "SYMBOL", "SYS"]
  
  # Layer activation info for tri-layers and hold-taps
  layer_names:
    SYS: "NAV + FUN"
  
  # Specify which keys activate each layer (for highlighting)
  layer_binding:
    NAV:
      - "&lt_spc 2 SPACE"
    FUN:
      - "&mo FUN"
    SYS:
      - "&lt_spc 2 SPACE"  # LH1 (NAV)
      - "&mo FUN"           # RH2 (FUN)
    SYMBOL:
      - "&lt_ent 4 RET"
    WM:
      - "&smart_wm WM 0"
  
  # Styling
  key_h: 60
  key_w: 60
  split_gap: 40
  combo_w: 36  # Increase combo box width
  combo_h: 32  # Increase combo box height
  
  # Custom CSS with GitHub Light color scheme
  svg_extra_style: |
    /* GitHub Light colors */
    svg.keymap {
      font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
      font-size: 14px;
      fill: #24292e !important;  /* dark gray text */
      background: #ffffff;  /* pure white background */
    }
    
    /* Light key background */
    rect.key {
      fill: #f6f8fa !important;  /* ghost white */
    }
    
    rect.key, rect.combo {
      stroke: #d1d5da !important;  /* light gray border */
      stroke-width: 1;
    }
    
    /* Combo styling - light blue accent */
    rect.combo, rect.combo-separate {
      fill: #c8e1ff !important;  /* Light blue */
      opacity: 0.8;
    }
    
    /* Layer activator styling - pastel orange */
    rect.held, rect.combo.held {
      fill: #FFB347 !important;  /* Pastel orange */
      opacity: 0.7;
    }
    
    /* Ghost keys more subtle */
    rect.ghost, rect.combo.ghost {
      opacity: 0.25 !important;
    }
    
    /* Combo text styling - make tap/shift labels more balanced */
    text.combo {
      font-size: 10px;
    }
    
    /* Single symbol combos - center aligned (when there's no shifted variant) */
    text.combo.tap:only-child {
      transform: translateY(0) !important;
      font-size: 11px !important;
    }
    
    /* Top symbol (shifted) - positioned at top, closer to tap */
    text.shifted {
      font-size: 10px !important;
      font-weight: 400;
    }
    
    /* Bottom symbol (tap) - positioned at bottom */
    text.tap {
      font-size: 11px !important;
      font-weight: 500;
    }
    
    /* Adjust vertical spacing for mod-morph symbols - minimal gap, tap lower */
    /* Only apply to keys/combos that HAVE a shifted sibling */
    g.key:has(text.shifted) text.shifted,
    g.combo:has(text.shifted) text.shifted {
      transform: translateY(2px);
    }
    
    g.key:has(text.shifted) text.tap,
    g.combo:has(text.shifted) text.tap {
      transform: translateY(9px);
    }
    
    /* Override for single-symbol combos - center them */
    g.combo:not(:has(text.shifted)) text.tap {
      transform: translateY(0) !important;
    }
